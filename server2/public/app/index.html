<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ホーム（仮）</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="provisional">仮実装の画面です。今後作り直します</div>
<main>
  <section data-screen="loading"><p>読み込んでいます…</p></section>

  <section data-screen="select" hidden>
    <h1>ユーザの選択</h1>
    <p class="note">テストや訓練を行う人を選んでください。</p>
    <div id="userChoices" class="choices"></div>
    <div class="card">
      <h2 style="margin-top:0">この端末</h2>
      <p id="device" class="note"></p>
    </div>
    <div class="row"><button id="logout" type="button">ログアウト</button></div>
    <p id="selectError" class="error" role="alert" hidden></p>
  </section>

  <section data-screen="home" hidden>
    <h1 id="homeTitle"></h1>
    <div id="menu" class="choices"></div>
    <div id="familyEditArea" class="choices" hidden>
      <button id="editFamily" type="button">家族を編集</button>
    </div>
    <div class="row"><button id="changeUser" type="button">ユーザを切り替える</button></div>
  </section>

  <section data-screen="family" hidden>
    <h1>家族の編集</h1>
    <div id="familyUsers"></div>
    <p id="limitNote" class="note" hidden></p>
    <div class="row">
      <button id="addUser" type="button" class="primary">ユーザを追加</button>
      <button id="backHome" type="button">戻る</button>
    </div>
  </section>

  <section data-screen="error" hidden>
    <p id="loadError" class="error" role="alert"></p>
  </section>
</main>
<script type="module" src="home.js"></script>
</body>
</html>
